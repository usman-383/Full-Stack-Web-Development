<!DOCTYPE html>
<html>

<head>
    <title>Table Tags In HTML</title>
</head>

<body>
    <h2>Table Example</h2>
    <table border="1" width="80%" align="center">
        <caption><strong>Grocery List</strong></caption>
        <thead>
            <tr bgcolor="lightgray">
                <th>Item</th>
                <th>Price</th>
                <th>Quantity</th>
            </tr>
        </thead>

        <tbody>

            <tr>
                <td>Milk</td>
                <td>$2.50</td>
                <td>1 liter</td>
            </tr>
            <tr>
                <td>Bread</td>
                <td>$1.50</td>
                <td>1 loaf</td>
            </tr>
            <tr>
                <td>Eggs</td>
                <td>$3.00</td>
                <td>12 pieces</td>
            </tr>
            <tr>
                <td>Butter</td>
                <td>$4.00</td>
                <td>500 grams</td>
            </tr>
            <tr>
                <td>Fruits</td>
                <td>$5.00</td>
                <td>1 basket</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
