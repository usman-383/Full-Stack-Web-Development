<!DOCTYPE html>
<html>

<head>
    <title>Registration Page</title>
</head>

<body>
    <nav>
        <a href="index.html">Home</a> |
        <a href="login.html">Login</a> |
        <a href="categories.html">Categories</a>
    </nav>

    <form action="#" method="POST">

        <p>
            <label for="name">Enter Your Name:</label><br>
            <input type="text" id="name" name="name" required>
        </p>

        <p>
            <input type="radio" id="Male" name="gender" value="Male">
            <label for="Male">Male</label>

            <input type="radio" id="Female" name="gender" value="Female">
            <label for="Female">Female</label>
        </p>

        <p>
            <label for="userId">Enter User ID:</label><br>
            <input type="text" id="userId" name="userId">
        </p>

        <p>
            <label for="password">Enter Password:</label><br>
            <input type="password" id="password" name="password">
        </p>

        <p>
            <label for="email">Enter Email:</label><br>
            <input type="email" id="email" name="email">
        </p>

        <p>
            <label for="address">Enter Your Address:</label><br>
            <textarea id="address" name="address" rows="5" cols="30"></textarea>
        </p>

        <p>
            <input type="checkbox" id="ele" name="electronics" value="electronics">
            <label for="ele">Electronics</label><br>

            <input type="checkbox" id="fashion" name="Fashion" value="Fashion">
            <label for="fashion">Fashion</label><br>

            <input type="checkbox" id="books" name="Books" value="Books">
            <label for="books">Books</label>
        </p>

        <p>
            <label for="category">Select the Category</label><br>

            <select id="category" name="category">
                <option value="Premium">Premium</option>
                <option value="Regular">Regular</option>
            </select>
        </p>

        <p>
            <input type="submit" value="submit">
        </p>

    </form>

</body>
<footer>
    &copy; All rights reserved
</footer>

</html>
