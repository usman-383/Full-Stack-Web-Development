<!DOCTYPE html>
<html>

<head>
    <title>Registration HTML</title>
</head>
<body>
    <h2>Registration Form</h2>
    <form>
        <label for="name">Enter Your Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="username">Enter Your Username:</label><br>
        <input type="text" id="username" name="username" required><br><br>

        <label for="email">Enter Your Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Enter Your Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <label for="confirm-password">Confirm Your Password:</label><br>
        <input type="password" id="confirm-password" name="confirm-password" required><br><br>

        <textarea id="address" name="address" rows="4" cols="50" placeholder="Enter Your Address"></textarea><br><br>

        <label for="option">Select an Option:</label><br>
        <select id="option" name="option">
            <option value="option1">Option 1</option>
            <option value="option2">Option 2</option>
            <option value="option3">Option 3</option>
        </select><br><br>

        <input type="submit" value="Register">
    </form>
</body>

</html>
